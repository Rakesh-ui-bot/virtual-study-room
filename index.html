<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus - Virtual Study Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="dark-mode">
    <div id="app">
      <div class="background-overlay"></div>
      
      <header class="top-nav glass-panel">
        <div class="logo">
          <i class="fa-solid fa-layer-group"></i> Nexus
        </div>
        <div class="nav-controls">
          <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <main class="dashboard">
        
        <!-- Timer Widget -->
        <div class="widget glass-panel draggable" id="pomodoro-widget">
          <div class="widget-header">
            <h3><i class="fa-solid fa-clock"></i> Focus Timer</h3>
            <button class="drag-handle"><i class="fa-solid fa-grip"></i></button>
          </div>
          <div class="widget-content">
            <div class="timer-display">
              <svg class="progress-ring" width="200" height="200">
                <circle class="progress-ring__circle" stroke="white" stroke-width="8" fill="transparent" r="90" cx="100" cy="100"/>
              </svg>
              <div class="time-text" id="time-left">25:00</div>
              <div class="mode-text" id="timer-mode">Pomodoro</div>
            </div>
            <div class="timer-controls">
              <button id="btn-start" class="primary-btn"><i class="fa-solid fa-play"></i></button>
              <button id="btn-pause" class="secondary-btn"><i class="fa-solid fa-pause"></i></button>
              <button id="btn-reset" class="secondary-btn"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="timer-modes">
              <button class="mode-btn active" data-mode="pomodoro">25</button>
              <button class="mode-btn" data-mode="shortBreak">5</button>
              <button class="mode-btn" data-mode="longBreak">15</button>
            </div>
          </div>
        </div>

        <!-- Todo Widget -->
        <div class="widget glass-panel draggable" id="todo-widget">
          <div class="widget-header">
            <h3><i class="fa-solid fa-list-check"></i> Tasks</h3>
            <button class="drag-handle"><i class="fa-solid fa-grip"></i></button>
          </div>
          <div class="widget-content">
            <div class="task-input-container">
              <input type="text" id="new-task-input" placeholder="Add a new task...">
              <button id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul id="task-list" class="task-list">
              <!-- Tasks will be injected here -->
            </ul>
          </div>
        </div>

        <!-- Music Widget -->
        <div class="widget glass-panel draggable" id="music-widget">
          <div class="widget-header">
            <h3><i class="fa-solid fa-music"></i> Ambient Music</h3>
            <button class="drag-handle"><i class="fa-solid fa-grip"></i></button>
          </div>
          <div class="widget-content">
            <div class="track-info">
              <div class="album-art"><i class="fa-solid fa-headphones"></i></div>
              <div class="track-details">
                <div class="track-title" id="current-track-title">Lofi Chill</div>
                <div class="track-artist">Ambient Stream</div>
              </div>
            </div>
            <div class="music-controls">
              <button id="music-prev" class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
              <button id="music-play" class="primary-btn"><i class="fa-solid fa-play"></i></button>
              <button id="music-next" class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="volume-control">
              <i class="fa-solid fa-volume-low"></i>
              <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>
            <audio id="ambient-audio" loop></audio>
          </div>
        </div>

        <!-- Analytics Widget -->
        <div class="widget glass-panel draggable" id="analytics-widget">
          <div class="widget-header">
            <h3><i class="fa-solid fa-chart-line"></i> Productivity</h3>
            <button class="drag-handle"><i class="fa-solid fa-grip"></i></button>
          </div>
          <div class="widget-content analytics-content">
            <div class="stat-box">
              <div class="stat-value" id="stat-sessions">0</div>
              <div class="stat-label">Pomodoros</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="stat-focus">0h</div>
              <div class="stat-label">Focus Time</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="stat-tasks">0</div>
              <div class="stat-label">Tasks Done</div>
            </div>
          </div>
        </div>

      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
